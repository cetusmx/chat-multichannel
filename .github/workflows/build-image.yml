# Builds the SalesFlow app image once and publishes it to GHCR so every
# client stack (deploy/clients/*) pulls the same artifact.
#
# Tags: <sha>, <branch>, and `latest` on main. Pin a tag in each client's
# APP_IMAGE for controlled rollouts; use deploy/scripts/deploy-all.sh.
name: Build & publish images

on:
  push:
    branches: [main, platform/decoupling]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App image metadata
        id: app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/salesflow-app
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push app (backend + web)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.app.outputs.tags }}
          labels: ${{ steps.app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Superadmin image metadata
        id: sa
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/salesflow-superadmin
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push superadmin portal
        uses: docker/build-push-action@v6
        with:
          context: ./superadmin-frontend
          file: ./superadmin-frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.SUPERADMIN_API_URL || '' }}
          tags: ${{ steps.sa.outputs.tags }}
          labels: ${{ steps.sa.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
