services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: salesflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salesflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesflow_dev}
      POSTGRES_DB: ${POSTGRES_DB:-salesflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salesflow} -d ${POSTGRES_DB:-salesflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: salesflow-app
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js && node src/index.js"
    ports:
      - "4005:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-salesflow}:${POSTGRES_PASSWORD:-salesflow_dev}@postgres:5432/${POSTGRES_DB:-salesflow}?connection_limit=5
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
      SUPERADMIN_JWT_SECRET: ${SUPERADMIN_JWT_SECRET:-dev-superadmin-secret-change-in-production}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-12345678901234567890123456789012}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_uploads:/app/backend/uploads

  superadmin-frontend:
    build:
      context: ./superadmin-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4005}
    container_name: salesflow-superadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:4006:80"
    depends_on:
      - app

volumes:
  postgres_data:
  app_uploads:
